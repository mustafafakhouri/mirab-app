name: Build Mi3rab APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and extract project
        run: |
          base64 -d mirab_src.b64 > mirab_src.tgz
          mkdir -p proj && tar xzf mirab_src.tgz -C proj
      - name: Overlay code overrides (app.js, styles.css, MainActivity.kt)
        run: |
          set -e
          ASSETS=proj/app/src/main/assets/assets
          JAVA=proj/app/src/main/java/com/bethratfikra/mirab
          if [ -f buildsrc/app.js ]; then cp buildsrc/app.js "$ASSETS/app.js"; echo "overlaid app.js"; fi
          if [ -f buildsrc/styles.css ]; then cp buildsrc/styles.css "$ASSETS/styles.css"; echo "overlaid styles.css"; fi
          if [ -f buildsrc/MainActivity.kt ]; then cp buildsrc/MainActivity.kt "$JAVA/MainActivity.kt"; echo "overlaid MainActivity.kt"; fi
      - name: Fetch Uthmani font (Amiri) into assets
        run: |
          set -e
          FDIR=proj/app/src/main/assets/assets/fonts
          mkdir -p "$FDIR"
          dl(){ curl -fsSL --retry 4 --retry-all-errors -o "$2" "$1"; }
          # primary: jsDelivr (fontsource) ; fallback: unpkg
          dl "https://cdn.jsdelivr.net/npm/@fontsource/amiri@5/files/amiri-arabic-400-normal.woff2" "$FDIR/amiri-arabic-400-normal.woff2" \
            || dl "https://unpkg.com/@fontsource/amiri@5/files/amiri-arabic-400-normal.woff2" "$FDIR/amiri-arabic-400-normal.woff2"
          dl "https://cdn.jsdelivr.net/npm/@fontsource/amiri@5/files/amiri-arabic-700-normal.woff2" "$FDIR/amiri-arabic-700-normal.woff2" \
            || dl "https://unpkg.com/@fontsource/amiri@5/files/amiri-arabic-700-normal.woff2" "$FDIR/amiri-arabic-700-normal.woff2"
          sz=$(wc -c < "$FDIR/amiri-arabic-400-normal.woff2")
          echo "amiri 400 size: $sz bytes"
          if [ "$sz" -lt 50000 ]; then echo "ERROR: Amiri font download failed/too small"; exit 1; fi
          ls -la "$FDIR"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Prepare mirab.apk
        run: cp proj/app/build/outputs/apk/debug/app-debug.apk mirab.apk
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mirab-apk
          path: mirab.apk
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Mi3rab latest
          files: mirab.apk

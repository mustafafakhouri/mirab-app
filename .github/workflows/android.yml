name: Build Mi3rab APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and extract project
        run: |
          base64 -d mirab_src.b64 > mirab_src.tgz
          mkdir -p proj && tar xzf mirab_src.tgz -C proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Prepare mirab.apk
        run: cp proj/app/build/outputs/apk/debug/app-debug.apk mirab.apk
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mirab-apk
          path: mirab.apk
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Mi3rab latest
          files: mirab.apk

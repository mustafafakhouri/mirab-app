name: Build Mi3rab APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and extract project
        run: |
          base64 -d mirab_src.b64 > mirab_src.tgz
          mkdir -p proj && tar xzf mirab_src.tgz -C proj
          ls -la proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: mirab-debug-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
